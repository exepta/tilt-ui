[package]
name = "tilt-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A component-based HTML and CSS UI framework for Bevy"
keywords = ["bevy", "ui", "html", "css", "gamedev"]
categories = ["game-development", "gui"]

[lib]
path = "src/lib.rs"

[features]
default = ["component"]

component = [
    "html",
    "css",
    "tilt-ui-runtime/component",
    "dep:bevy_winit",
]

html = [
    "tilt-ui-runtime/html",
]

css = [
    "tilt-ui-runtime/css",
]

hot-reload = [
    "tilt-ui-runtime/hot-reload",
]

fluent = ["component", "tilt-ui-runtime/fluent"]

[dependencies]
tilt-ui-core.workspace = true
tilt-ui-runtime.workspace = true
tilt-ui-macros.workspace = true
bevy = { workspace = true, features = ["bevy_winit", "x11"] }
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true

# Enable the image cursor backend alongside the facade's window integration.
[dependencies.bevy_winit]
version = "0.19"
optional = true
default-features = false
features = ["custom_cursor"]
