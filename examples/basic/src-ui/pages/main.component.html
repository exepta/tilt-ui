<div class="root">
    <p class="title pulse">TiltUI CSS works</p>
    <app-header />
    <button class="primary" onclick="play">Play</button>
    <button class="primary" disabled="true">Disabled</button>

    <p class="section-title">Selectable controls</p>
    <checkbox class="checkbox" checked="true">Music</checkbox>
    <toggle-button class="toggle">Bold</toggle-button>
    <switch-button class="switch" checked="true">Notifications</switch-button>
    <field-set class="radios">
        <radio-button class="radio" checked="true">Low</radio-button>
        <radio-button class="radio">High</radio-button>
    </field-set>

    <p class="section-title">Value controls</p>
    <input placeholder="Type here" value="TiltUI" />
    <textarea placeholder="A multiline note" />
    <slider min="0" max="100" value="64" step="1" />
    <progress-bar min="0" max="100" value="72" />
</div>
